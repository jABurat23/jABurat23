name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Run daily at midnight UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: jABurat23
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#0f6d31&color_dots=#00c647

      - name: Copy to output folder (for README)
        run: |
          mkdir -p output
          cp dist/snake.svg output/snake.svg

      - name: Commit and push
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update snake animation"
          add: "output/snake.svg"